<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nicnice.top</title>
<meta name="description" content="nicnice.top — 建设中">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #faf9f6;
    --fg: #1a1a18;
    --muted: #78766e;
    --rule: #e4e2da;
    --accent: #b45309;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  main {
    max-width: 42rem;
    margin: 0 auto;
    padding: 14vh 1.5rem 4rem;
  }
  .eyebrow {
    margin: 0;
    font: 500 .75rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: .55rem 0 1.25rem;
    font: 400 clamp(2.4rem, 8vw, 4.25rem)/1.05 Georgia, "Songti SC", "SimSun", serif;
    letter-spacing: -.02em;
    overflow-wrap: anywhere;
  }
  .lede {
    margin: 0 0 2.75rem;
    max-width: 32rem;
    font-size: 1.0625rem;
    color: var(--muted);
  }
  hr {
    border: 0;
    border-top: 1px solid var(--rule);
    margin: 0 0 1.15rem;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: .35rem 2rem;
    font: .8125rem/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--muted);
  }
  .meta span b { font-weight: 500; color: var(--fg); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Under construction</p>
  <h1>nicnice.top</h1>
  <p class="lede">这里还什么都没有。域名已经就位，内容在路上。</p>
  <hr>
  <div class="meta">
    <span><b>Status</b> placeholder</span>
    <span><b>Host</b> GitHub Pages</span>
    <span><b>Deploy</b> 2026-09-28</span>
  </div>
</main>
</body>
</html>
